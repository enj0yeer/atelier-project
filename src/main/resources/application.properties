spring.application.name=atelier
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/atelier_db}
spring.datasource.username=${DB_USERNAME:atelier}
spring.datasource.password=${DB_PASSWORD:atelier}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
spring.mvc.problemdetails.enabled=true
logging.level.org.springframework.security=INFO
logging.level.ru.fa.atelier=INFO
