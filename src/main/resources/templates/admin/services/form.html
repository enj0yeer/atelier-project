<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Услуга — Atelier</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container narrow"><div class="page-heading"><div><p class="eyebrow">АДМИНИСТРИРОВАНИЕ</p><h1 th:text="${pageTitle}"></h1></div></div>
<form th:action="${serviceId == null} ? @{/admin/services} : @{/admin/services/{id}(id=${serviceId})}" th:object="${serviceForm}" method="post" class="panel form-stack">
<label>Название<input type="text" th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label>
<label>Описание<textarea rows="4" th:field="*{description}"></textarea><small class="field-error" th:errors="*{description}"></small></label>
<label>Цена, ₽<input type="number" step="0.01" min="0.01" th:field="*{price}" required><small class="field-error" th:errors="*{price}"></small></label>
<div class="form-actions"><a class="button button-quiet" th:href="@{/services}">Отмена</a><button class="button button-primary" type="submit">Сохранить</button></div>
</form></main></body></html>
