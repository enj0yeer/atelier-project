services:
  postgres:
    image: postgres:15-alpine
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atelier_db
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atelier}
    ports:
      - "5433:5432"
    volumes:
      - atelier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  atelier_pgdata:
