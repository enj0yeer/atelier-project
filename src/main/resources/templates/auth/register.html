<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация - Atelier</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="auth-shell"><section class="auth-card">
    <p class="eyebrow">НОВЫЙ АККАУНТ</p><h1>Регистрация</h1>
    <div class="alert alert-error" th:if="${registrationError}" th:text="${registrationError}"></div>
    <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="form-stack">
        <label>ФИО<input type="text" th:field="*{fullName}" required><small class="field-error" th:errors="*{fullName}"></small></label>
        <label>Электронная почта<input type="email" th:field="*{email}" required><small class="field-error" th:errors="*{email}"></small></label>
        <label>Телефон<input type="tel" th:field="*{phone}" placeholder="+7 900 000-00-00"><small class="field-error" th:errors="*{phone}"></small></label>
        <label>Пароль<input type="password" th:field="*{password}" minlength="8" required><small class="field-error" th:errors="*{password}"></small></label>
        <button class="button button-primary button-wide" type="submit">Создать аккаунт</button>
    </form>
    <p class="form-foot">Уже зарегистрированы? <a th:href="@{/login}">Войти</a></p>
</section></main>
</body></html>
